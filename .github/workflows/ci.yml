name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.16.1.0"

      - name: Resolve dependencies
        run: cabal update && cabal build all --dry-run

      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-9.10.3-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc-9.10.3-

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test --test-show-details=direct

      - name: Benchmarks compile
        run: cabal bench --benchmark-options='--help' >/dev/null
